<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="인하대학교 공지사항을 AI로 정리해 마감일과 일정을 한눈에" />
    <title>인하 공지 · Inha Notices</title>
    <script>
      // Design test: soulbound-inspired theme by default; ?theme=gchf (or ?theme=soulbound) switches and is remembered.
      (function () {
        var t = 'soulbound';
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'gchf' || q === 'soulbound') localStorage.setItem('appTheme', q);
          t = localStorage.getItem('appTheme') || t;
        } catch (e) {}
        if (t !== 'gchf') document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Orbitron:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
